<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colmenar</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="splash" class="status-screen">
  <div id="spin" class="spin"></div>
  <h1>🐝 Colmenar</h1>
  <div id="badge" class="status-badge loading">Conectando con la base de datos…</div>
  <p id="status" class="muted"></p>
</div>

<div id="app" class="app" style="display:none;">
  <header class="app-header">
    <h1>🐝 Colmenar</h1>
    <nav class="tabs">
      <button class="tab active" data-vista="cajas">Cajas</button>
      <button class="tab" data-vista="mapa">Mapa</button>
    </nav>
  </header>
  <main>
    <div id="view-cajas">
    <input id="buscador" class="buscador" type="text" placeholder="Buscar caja o ubicación…">
    <div class="filtros">
      <button class="chip-filtro active" data-f="todas">Todas</button>
      <button class="chip-filtro" data-f="con">Con abejas</button>
      <button class="chip-filtro" data-f="sin">Sin abejas</button>
    </div>
    <div id="lista-cajas" class="lista-cajas"></div>
    </div>

    <div id="view-mapa" style="display:none;">
      <div id="mapa-aviso" class="muted mapa-aviso"></div>
      <div id="mapa"></div>
      <div id="mapa-sin-gps" class="sin-gps"></div>
    </div>
  </main>
  <button id="btn-agregar" class="fab" aria-label="Agregar caja">+</button>
</div>

<div id="backdrop" class="backdrop"></div>
<div id="sheet" class="sheet">
  <div class="sheet-head">
    <h2 id="sheet-title">Caja</h2>
    <button id="sheet-close" class="sheet-close" aria-label="Cerrar">✕</button>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
  <div class="sheet-foot">
    <button id="sheet-cancel" class="btn-ghost">Cancelar</button>
    <button id="sheet-save" class="btn-save">Guardar</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/cajas.js"></script>
<script src="js/ui.js"></script>
<script src="js/editor.js"></script>
<script src="js/mapa.js"></script>
<script src="js/app.js"></script>
</body>
</html>
