<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colmenapp</title>
<style>html,body{background:#241708;color:#F4E9D0;font-family:system-ui,sans-serif;margin:0}</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>

<div id="splash" class="status-screen">
  <div id="spin" class="spin"></div>
  <h1>🐝 Colmenapp</h1>
  <div id="badge" class="status-badge loading">Cargando...🐝🐝🐝</div>
  <p id="status" class="muted"></p>
</div>

<div id="login" class="status-screen" style="display:none;">
  <h1>🐝 Colmenapp</h1>
  <p class="muted">Ingresá con tu correo y contraseña.</p>
  <form id="form-login" class="login-form">
    <input id="login-email" type="email" placeholder="Correo" autocomplete="username" required>
    <input id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button id="login-btn" type="submit" class="btn-save">Ingresar</button>
    <div id="login-error" class="gps-msg error" style="display:none;"></div>
  </form>
</div>

<div id="app" class="app" style="display:none;">
  <header class="app-header">
    <div class="header-fila">
      <h1>🐝 Colmenapp</h1>
      <div class="usuario-barra">
        <span id="usuario-email" class="usuario-correo"></span>
        <span id="usuario-rol" class="pill pill-honey"></span>
        <button id="btn-salir" class="btn-salir" type="button">Salir</button>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-vista="cajas">Cajas</button>
      <button class="tab" data-vista="mapa">Mapa</button>
      <button class="tab" data-vista="resumen">Resumen</button>
      <button class="tab" data-vista="usuarios" style="display:none;">Usuarios</button>
    </nav>
  </header>
  <main>
    <div id="view-cajas">
    <input id="buscador" class="buscador" type="text" placeholder="Buscar caja o ubicación…">
    <div class="filtros">
      <button class="chip-filtro active" data-f="todas">Todas</button>
      <button class="chip-filtro" data-f="con">Con abejas</button>
      <button class="chip-filtro" data-f="sin">Sin abejas</button>
    </div>
    <div id="lista-cajas" class="lista-cajas"></div>
    </div>

    <div id="view-mapa" style="display:none;">
      <div id="mapa-aviso" class="muted mapa-aviso"></div>
      <div id="mapa"></div>
      <div id="mapa-sin-gps" class="sin-gps"></div>
    </div>

    <div id="view-resumen" style="display:none;"></div>

    <div id="view-usuarios" style="display:none;"></div>
  </main>
  <button id="btn-agregar" class="fab" aria-label="Agregar caja">+</button>
</div>

<div id="backdrop" class="backdrop"></div>
<div id="sheet" class="sheet">
  <div class="sheet-head">
    <h2 id="sheet-title">Caja</h2>
    <button id="sheet-close" class="sheet-close" aria-label="Cerrar">✕</button>
  </div>
  <div id="sheet-body" class="sheet-body"></div>
  <div class="sheet-foot">
    <button id="sheet-cancel" class="btn-ghost">Cancelar</button>
    <button id="sheet-save" class="btn-save">Guardar</button>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// SCRUM-40: cada carga pide los archivos con un número distinto (?v=...),
// así el navegador y GitHub Pages nunca usan una copia vieja.
(async function () {
  const v = Date.now();
  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = "css/style.css?v=" + v;
  document.head.appendChild(css);

  const archivos = [
    "js/supabaseClient.js", "js/auth.js", "js/cajas.js", "js/modal.js", "js/ui.js",
    "js/editor.js", "js/mapa.js", "js/resumen.js", "js/usuarios.js", "js/app.js",
  ];
  for (const src of archivos) {
    await new Promise((ok, fallo) => {
      const s = document.createElement("script");
      s.src = src + "?v=" + v;
      s.onload = ok;
      s.onerror = () => fallo(new Error("No se pudo cargar " + src));
      document.body.appendChild(s);
    }).catch((e) => console.error(e));
  }
})();
</script>
</body>
</html>
